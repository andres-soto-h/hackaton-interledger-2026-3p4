openapi: 3.0.3
info:
  title: Tranqui API — Solicitar pago
  version: 1.0.0
  description: |
    `POST /api/v1/payment-requests` (spec 006). Crea un *incoming payment* en la
    wallet del receptor y devuelve su link de cobro.
paths:
  /api/v1/payment-requests:
    post:
      summary: Solicitar pago
      operationId: createPaymentRequest
      tags:
        - Payment Requests
      security:
        - ApiKeyAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentRequestBody'
      responses:
        '201':
          description: Solicitud creada; el link de cobro está en `incomingPaymentUrl`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentRequest'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '422':
          description: No se pudo crear la solicitud.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                assetMismatch:
                  value:
                    error:
                      code: ASSET_MISMATCH
                      message: Asset code does not match the wallet
                walletNotFound:
                  value:
                    error:
                      code: WALLET_NOT_FOUND
                      message: Wallet address not found
                walletNotAllowed:
                  value:
                    error:
                      code: WALLET_NOT_ALLOWED
                      message: Wallet address is not allowed
        '502':
          $ref: '#/components/responses/OpenPaymentsError'
        '503':
          $ref: '#/components/responses/OpenPaymentsUnavailable'
        '504':
          $ref: '#/components/responses/OpenPaymentsTimeout'
  /api/v1/payments:
    post:
      summary: Cotiza un pago (P2P o P2M) con el monto diario preaprobado
      operationId: quotePayment
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePaymentBody'
      responses:
        '201':
          description: Pago creado en AWAITING_CONFIRMATION con el desglose del quote.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentQuote'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          description: La cuenta no tiene una vinculación de wallet activa.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: WALLET_NOT_LINKED
                  message: Wallet is not linked
        '422':
          description: El total supera el disponible del día; también ASSET_MISMATCH o INCOMING_PAYMENT_NOT_PAYABLE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DAILY_LIMIT_EXCEEDED
                  message: Daily limit exceeded
        '409':
          $ref: '#/components/responses/IdempotencyConflict'
        '502':
          $ref: '#/components/responses/OpenPaymentsError'
        '503':
          description: Pagos desactivados desde el panel; también OPEN_PAYMENTS_UNAVAILABLE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENTS_DISABLED
                  message: Payments are disabled
        '504':
          $ref: '#/components/responses/OpenPaymentsTimeout'
  /api/v1/payments/{id}/confirm/options:
    post:
      summary: Opciones WebAuthn para confirmar el pago con la passkey
      operationId: confirmPaymentOptions
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: Desafío ligado a este pago y a este usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentConfirmOptions'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '404':
          description: Pago inexistente o de otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_FOUND
                  message: Payment not found
        '409':
          description: El pago no está esperando confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_CONFIRMABLE
                  message: Payment is not awaiting confirmation
        '410':
          description: El quote venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: QUOTE_EXPIRED
                  message: Quote expired
        '503':
          description: Pagos desactivados desde el panel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENTS_DISABLED
                  message: Payments are disabled
  /api/v1/payments/{id}/confirm:
    post:
      summary: Confirma el pago firmando con la passkey
      operationId: confirmPayment
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmPaymentBody'
      responses:
        '202':
          description: Pago en PROCESSING; consultar su estado hasta COMPLETED o FAILED.
          headers:
            Retry-After:
              description: Segundos sugeridos antes de consultar de nuevo.
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentProcessing'
        '400':
          description: Firma inválida, desafío vencido o usado (CHALLENGE_EXPIRED) o cuerpo inválido (VALIDATION_ERROR).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PASSKEY_VERIFICATION_FAILED
                  message: Passkey verification failed
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '404':
          description: Pago inexistente o de otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_FOUND
                  message: Payment not found
        '409':
          description: El pago no está esperando confirmación.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_CONFIRMABLE
                  message: Payment is not awaiting confirmation
        '410':
          description: El quote venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: QUOTE_EXPIRED
                  message: Quote expired
        '422':
          description: El total ya no cabe en el disponible; el pago vuelve a AWAITING_CONFIRMATION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DAILY_LIMIT_EXCEEDED
                  message: Daily limit exceeded
        '503':
          description: Pagos desactivados desde el panel.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENTS_DISABLED
                  message: Payments are disabled
  /api/v1/payments/{id}/cancel:
    post:
      summary: Cancela un pago que espera confirmación
      operationId: cancelPayment
      tags:
        - Payments
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/PaymentId'
      responses:
        '204':
          description: Pago cancelado (CANCELLED). Sigue permitido con los pagos desactivados.
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '404':
          description: Pago inexistente o de otro usuario.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_FOUND
                  message: Payment not found
        '409':
          description: El pago no está en AWAITING_CONFIRMATION.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: PAYMENT_NOT_CANCELLABLE
                  message: Payment cannot be cancelled
  /api/v1/auth/register/options:
    post:
      summary: Opciones de registro con passkey
      operationId: registerPasskeyOptions
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterOptionsRequest'
      responses:
        '200':
          description: Opciones de WebAuthn para crear la passkey, con su `challengeId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOptions'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          $ref: '#/components/responses/WalletAlreadyRegistered'
        '422':
          $ref: '#/components/responses/WalletNotFound'
  /api/v1/auth/register/verify:
    post:
      summary: Verificar el registro de la passkey
      operationId: registerPasskeyVerify
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCredentialRequest'
      responses:
        '201':
          description: Cuenta creada y sesión emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/PasskeyError'
        '409':
          $ref: '#/components/responses/WalletAlreadyRegistered'
  /api/v1/auth/login/options:
    post:
      summary: Opciones de inicio de sesión con passkey
      operationId: loginPasskeyOptions
      tags:
        - Auth
      security: []
      responses:
        '200':
          description: Opciones de WebAuthn para firmar con la passkey, con su `challengeId`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChallengeOptions'
  /api/v1/auth/login/verify:
    post:
      summary: Verificar el inicio de sesión con passkey
      operationId: loginPasskeyVerify
      tags:
        - Auth
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VerifyCredentialRequest'
      responses:
        '200':
          description: Sesión emitida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSession'
        '400':
          $ref: '#/components/responses/PasskeyError'
        '401':
          $ref: '#/components/responses/SessionInvalid'
  /api/v1/me:
    get:
      summary: Datos de la cuenta autenticada
      operationId: getMe
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Datos públicos de la cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/SessionInvalid'
    delete:
      summary: Borrar la cuenta autenticada y sus passkeys
      operationId: deleteMe
      tags:
        - Account
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Cuenta borrada; los pagos se conservan.
        '401':
          $ref: '#/components/responses/ReauthRequired'
  /api/v1/me/wallet-link:
    post:
      summary: Inicia la vinculación de la wallet
      operationId: startWalletLink
      tags:
        - Wallet Link
      security:
        - BearerAuth: []
      responses:
        '202':
          description: Vinculación iniciada; el usuario debe aprobar en su wallet.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLinkStart'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '409':
          description: Ya hay una vinculación ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: WALLET_ALREADY_LINKED
                  message: Wallet is already linked
        '422':
          description: La moneda de la wallet no tiene monto diario configurado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CURRENCY_NOT_SUPPORTED
                  message: Currency is not supported
        '502':
          $ref: '#/components/responses/OpenPaymentsError'
        '503':
          $ref: '#/components/responses/OpenPaymentsUnavailable'
        '504':
          $ref: '#/components/responses/OpenPaymentsTimeout'
    get:
      summary: Estado de la vinculación de la wallet
      operationId: getWalletLink
      tags:
        - Wallet Link
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Estado de la vinculación; `Retry-After` mientras está pendiente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletLinkStatus'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '404':
          description: No hay vinculación para esta cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: LINK_NOT_FOUND
                  message: Wallet link not found
    delete:
      summary: Desvincula la wallet (cancela el grant)
      operationId: unlinkWallet
      tags:
        - Wallet Link
      security:
        - BearerAuth: []
      responses:
        '204':
          description: Vinculación cancelada y token borrado.
        '401':
          $ref: '#/components/responses/ReauthRequired'
        '404':
          description: No hay vinculación para esta cuenta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: LINK_NOT_FOUND
                  message: Wallet link not found
  /api/v1/me/allowance:
    get:
      summary: Disponible del monto diario preaprobado
      operationId: getAllowance
      tags:
        - Wallet Link
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Límite diario y gasto del periodo actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Allowance'
              example:
                dailyLimit:
                  value: '200.00'
                  assetCode: USD
                spent:
                  value: '45.50'
                  assetCode: USD
                available:
                  value: '154.50'
                  assetCode: USD
                periodStart: '2026-10-17T05:00:00.000Z'
                periodEnd: '2026-10-18T05:00:00.000Z'
        '401':
          $ref: '#/components/responses/SessionInvalid'
        '403':
          description: Sin vinculación ACTIVE.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: WALLET_NOT_LINKED
                  message: Wallet is not linked
        '422':
          description: El pago superaría el disponible del día.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: DAILY_LIMIT_EXCEEDED
                  message: Daily limit exceeded
  /api/v1/auth/callback:
    get:
      summary: Callback de la autorización de la wallet
      operationId: walletLinkCallback
      tags:
        - Wallet Link
      security: []
      parameters:
        - name: linkId
          in: query
          required: true
          schema:
            type: string
        - name: interact_ref
          in: query
          required: false
          schema:
            type: string
        - name: hash
          in: query
          required: false
          schema:
            type: string
        - name: result
          in: query
          required: false
          schema:
            type: string
      responses:
        '302':
          description: Redirección a `FRONTEND_RESULT_URL` con `linkId` y `status`.
          headers:
            Location:
              schema:
                type: string
        '200':
          description: Página HTML provisional cuando no hay `FRONTEND_RESULT_URL`.
        '400':
          description: Callback inválido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: CALLBACK_INVALID
                  message: Invalid callback
        '404':
          description: Vinculación inexistente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: LINK_NOT_FOUND
                  message: Wallet link not found
        '409':
          description: Callback ya usado o límites del grant distintos a los pedidos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              examples:
                alreadyUsed:
                  value:
                    error:
                      code: CALLBACK_ALREADY_USED
                      message: Callback was already used
                limitsMismatch:
                  value:
                    error:
                      code: GRANT_LIMITS_MISMATCH
                      message: Grant limits do not match
        '410':
          description: La autorización venció.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
              example:
                error:
                  code: AUTHORIZATION_EXPIRED
                  message: Authorization expired
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: x-api-key
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Clave de idempotencia opcional (spec 005).
      schema:
        type: string
        minLength: 8
        maxLength: 64
    PaymentId:
      name: id
      in: path
      required: true
      description: ID del pago (`pay_<ULID>`).
      schema:
        type: string
        pattern: '^pay_[0-9A-Z]{26}$'
  schemas:
    Amount:
      type: object
      required:
        - value
        - assetCode
      properties:
        value:
          type: string
          description: Monto decimal en string (sin exponentes).
          example: '10.50'
        assetCode:
          type: string
          pattern: '^[A-Z]{3}$'
          example: USD
    WalletLinkStart:
      type: object
      required:
        - linkId
        - authorizationUrl
        - dailyLimit
        - expiresAt
      properties:
        linkId:
          type: string
          example: wl_01J...
        authorizationUrl:
          type: string
          format: uri
        dailyLimit:
          $ref: '#/components/schemas/Amount'
        expiresAt:
          type: string
          format: date-time
    WalletLinkStatus:
      type: object
      required:
        - linkId
        - status
        - isFinal
        - walletVerified
        - dailyLimit
      properties:
        linkId:
          type: string
          example: wl_01J...
        status:
          type: string
          enum:
            - PENDING_AUTHORIZATION
            - ACTIVE
            - REJECTED
            - EXPIRED
            - REVOKED
        isFinal:
          type: boolean
        walletVerified:
          type: boolean
        dailyLimit:
          $ref: '#/components/schemas/Amount'
    Allowance:
      type: object
      required:
        - dailyLimit
        - spent
        - available
        - periodStart
        - periodEnd
      properties:
        dailyLimit:
          $ref: '#/components/schemas/Amount'
        spent:
          $ref: '#/components/schemas/Amount'
        available:
          $ref: '#/components/schemas/Amount'
        periodStart:
          type: string
          format: date-time
        periodEnd:
          type: string
          format: date-time
    CreatePaymentRequestBody:
      type: object
      required:
        - type
        - receiverWalletAddress
      properties:
        type:
          type: string
          enum:
            - p2p
            - p2m
        receiverWalletAddress:
          type: string
          maxLength: 2048
          description: Payment pointer (`$host/path`) o URL `https` de la wallet.
        amount:
          $ref: '#/components/schemas/Amount'
          description: Opcional; su moneda debe coincidir con la de la wallet.
        description:
          type: string
          maxLength: 140
        expiresInSeconds:
          type: integer
          minimum: 60
          maximum: 86400
          default: 900
    PaymentRequest:
      type: object
      required:
        - id
        - type
        - incomingPaymentUrl
        - receiverWalletAddress
        - receivedAmount
        - status
        - expiresAt
        - createdAt
      properties:
        id:
          type: string
          example: pr_01J...
        type:
          type: string
          enum:
            - p2p
            - p2m
        incomingPaymentUrl:
          type: string
        receiverWalletAddress:
          type: string
        amount:
          $ref: '#/components/schemas/Amount'
        receivedAmount:
          $ref: '#/components/schemas/Amount'
        description:
          type: string
        status:
          type: string
          enum:
            - PENDING
            - COMPLETED
            - EXPIRED
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    Error:
      type: object
      required:
        - error
      properties:
        error:
          type: object
          required:
            - code
            - message
          properties:
            code:
              type: string
            message:
              type: string
            details:
              type: array
              items:
                type: object
                properties:
                  path:
                    type: string
                  message:
                    type: string
    PublicUser:
      type: object
      required:
        - id
        - displayName
        - walletAddress
        - createdAt
      properties:
        id:
          type: string
          example: usr_01J...
        displayName:
          type: string
        walletAddress:
          type: string
        createdAt:
          type: string
          format: date-time
    Session:
      type: object
      required:
        - token
        - expiresAt
      properties:
        token:
          type: string
        expiresAt:
          type: string
          format: date-time
    AuthSession:
      type: object
      required:
        - user
        - session
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        session:
          $ref: '#/components/schemas/Session'
    ChallengeOptions:
      type: object
      required:
        - challengeId
        - options
      properties:
        challengeId:
          type: string
        options:
          type: object
          description: Opciones de WebAuthn (JSON) para pasar al navegador.
    RegisterOptionsRequest:
      type: object
      required:
        - displayName
        - walletAddress
      properties:
        displayName:
          type: string
          maxLength: 60
        walletAddress:
          type: string
          maxLength: 2048
    VerifyCredentialRequest:
      type: object
      required:
        - challengeId
        - credential
      properties:
        challengeId:
          type: string
        credential:
          type: object
          description: Credencial WebAuthn opaca tal como la devuelve el navegador.
          required:
            - id
          properties:
            id:
              type: string
    CreatePaymentBody:
      description: P2P (wallet del receptor y monto) o P2M (incoming payment existente). El emisor sale de la sesión.
      oneOf:
        - type: object
          additionalProperties: false
          required: [type, receiverWalletAddress, amount]
          properties:
            type:
              type: string
              enum: [p2p]
            receiverWalletAddress:
              type: string
              maxLength: 2048
            amount:
              $ref: '#/components/schemas/Amount'
            description:
              type: string
              maxLength: 140
        - type: object
          additionalProperties: false
          required: [type, incomingPaymentUrl]
          properties:
            type:
              type: string
              enum: [p2m]
            incomingPaymentUrl:
              type: string
              format: uri
              maxLength: 2048
            amount:
              $ref: '#/components/schemas/Amount'
            description:
              type: string
              maxLength: 140
    PaymentQuote:
      type: object
      required: [paymentId, status, confirmBy, quote, allowance]
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [AWAITING_CONFIRMATION]
        confirmBy:
          type: string
          format: date-time
        quote:
          type: object
          required: [debitAmount, receiveAmount, exchangeRate, fee, totalDebit]
          properties:
            debitAmount:
              $ref: '#/components/schemas/Amount'
            receiveAmount:
              $ref: '#/components/schemas/Amount'
            exchangeRate:
              type: string
            fee:
              allOf:
                - $ref: '#/components/schemas/Amount'
                - type: object
                  properties:
                    percentage:
                      type: string
            totalDebit:
              $ref: '#/components/schemas/Amount'
        allowance:
          type: object
          required: [dailyLimit, availableAfter]
          properties:
            dailyLimit:
              $ref: '#/components/schemas/Amount'
            availableAfter:
              $ref: '#/components/schemas/Amount'
    PaymentConfirmOptions:
      type: object
      required: [challengeId, options]
      properties:
        challengeId:
          type: string
        options:
          type: object
          description: Opciones de autenticación WebAuthn (PublicKeyCredentialRequestOptionsJSON).
    ConfirmPaymentBody:
      type: object
      additionalProperties: false
      required: [challengeId, credential]
      properties:
        challengeId:
          type: string
        credential:
          type: object
          description: Credencial WebAuthn firmada por el dispositivo (se pasa intacta al verificador).
    PaymentProcessing:
      type: object
      required: [paymentId, status]
      properties:
        paymentId:
          type: string
        status:
          type: string
          enum: [PROCESSING]
  responses:
    ValidationError:
      description: Cuerpo inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: VALIDATION_ERROR
              message: Invalid request
    Unauthorized:
      description: API key inválida o ausente.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: UNAUTHORIZED
              message: Invalid or missing API key
    IdempotencyConflict:
      description: Conflicto de idempotencia.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: IDEMPOTENCY_CONFLICT
              message: Idempotency conflict
    OpenPaymentsError:
      description: Error de Open Payments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: OPEN_PAYMENTS_ERROR
              message: Open Payments error
    OpenPaymentsUnavailable:
      description: Open Payments no disponible.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: OPEN_PAYMENTS_UNAVAILABLE
              message: Open Payments is unavailable
    OpenPaymentsTimeout:
      description: Timeout de Open Payments.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: OPEN_PAYMENTS_TIMEOUT
              message: Open Payments request timed out
    WalletAlreadyRegistered:
      description: La wallet address ya pertenece a otra cuenta.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: WALLET_ALREADY_REGISTERED
              message: Wallet address already registered
    WalletNotFound:
      description: La wallet no existe o no está permitida.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            walletNotFound:
              value:
                error:
                  code: WALLET_NOT_FOUND
                  message: Wallet address not found
            walletNotAllowed:
              value:
                error:
                  code: WALLET_NOT_ALLOWED
                  message: Wallet address is not allowed
    PasskeyError:
      description: Verificación de la passkey fallida o challenge inválido.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          examples:
            challengeExpired:
              value:
                error:
                  code: CHALLENGE_EXPIRED
                  message: Challenge expired, used or invalid
            passkeyVerificationFailed:
              value:
                error:
                  code: PASSKEY_VERIFICATION_FAILED
                  message: Passkey verification failed
            validationError:
              value:
                error:
                  code: VALIDATION_ERROR
                  message: Invalid request
    SessionInvalid:
      description: Sin sesión, JWT inválido o cuenta borrada o bloqueada.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: SESSION_INVALID
              message: Invalid or expired session
    ReauthRequired:
      description: Se requiere reautenticación con la passkey (sesión de más de 5 minutos).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
          example:
            error:
              code: REAUTH_REQUIRED
              message: Recent authentication required
